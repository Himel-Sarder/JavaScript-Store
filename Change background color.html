<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Color</title>
</head>
<body>
  <button onclick="changeBg()">Change Background</button>

  <script>
    function changeBg() {
      document.body.style.backgroundColor = "lightblue";
    }
  </script>
</body>
</html>
