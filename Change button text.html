<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Button Text</title>
</head>
<body>
  <button id="btn" onclick="changeBtn()">Click Me</button>

  <script>
    function changeBtn() {
      document.getElementById("btn").textContent = "Clicked";
    }
  </script>
</body>
</html>
