<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Color</title>
</head>
<body>
  <p id="text">Click the button to change my color</p>
  <button onclick="changeColor()">Change Color</button>

  <script>
    function changeColor() {
      document.getElementById("text").style.color = "red";
    }
  </script>
</body>
</html>
