<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Show Hide</title>
</head>
<body>
  <p id="para">This text can be hidden</p>
  <button onclick="toggle()">Show / Hide</button>

  <script>
    function toggle() {
      const p = document.getElementById("para");
      if (p.style.display === "none") {
        p.style.display = "block";
      } else {
        p.style.display = "none";
      }
    }
  </script>
</body>
</html>
